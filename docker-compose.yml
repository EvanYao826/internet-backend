services:
  mysql:
    image: mysql:8.0
    container_name: internet-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: internet_admin
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动时自动建表并导入演示数据
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # 用真实认证探测，避免初始化临时阶段的假就绪
      test: ["CMD", "mysql", "-uroot", "-p${DB_PASSWORD:-123456}", "-e", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build: .
    container_name: internet-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: internet_admin
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      # 生产环境务必通过环境变量注入 32 字节以上随机密钥
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-please-change-in-production-32bytes}
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  mysql-data:
