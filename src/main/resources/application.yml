server:
  port: 8080
  servlet:
    context-path: /api

spring:
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

jwt:
  # 生产环境必须通过环境变量 JWT_SECRET 注入，长度不少于 32 字节
  secret: ${JWT_SECRET:dev-only-secret-key-please-change-in-production-32bytes}
  # Token 有效期（分钟），默认 12 小时
  expire-minutes: 720

knife4j:
  enable: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
